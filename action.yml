name: A2AParkBench adversarial regression
description: Run browser-agent action policies against A2AParkBench adversarial UI-state mutations
branding:
  icon: shield
  color: purple
inputs:
  adapter:
    description: Repository-relative path to an ESM adapter exporting propose(context)
    required: true
  pack:
    description: Optional repository-relative mutation pack; defaults to the free starter pack
    required: false
  feed_url:
    description: Optional authenticated Team feed manifest URL
    required: false
  token:
    description: Team feed token; pass from a GitHub Actions secret
    required: false
runs:
  using: composite
  steps:
    - name: Run A2AParkBench
      shell: bash
      env:
        A2APARKBENCH_ADAPTER: ${{ inputs.adapter }}
        A2APARKBENCH_PACK: ${{ inputs.pack }}
        A2APARKBENCH_FEED_URL: ${{ inputs.feed_url }}
        A2APARKBENCH_TOKEN: ${{ inputs.token }}
        MUTANT_WEB_ADAPTER: ${{ inputs.adapter }}
        MUTANT_WEB_PACK: ${{ inputs.pack }}
        MUTANT_WEB_FEED_URL: ${{ inputs.feed_url }}
        MUTANT_WEB_TOKEN: ${{ inputs.token }}
      run: |
        args=(--adapter "$A2APARKBENCH_ADAPTER" --format github)
        if [[ -n "$A2APARKBENCH_FEED_URL" ]]; then
          args+=(--feed "$A2APARKBENCH_FEED_URL")
        elif [[ -n "$A2APARKBENCH_PACK" ]]; then
          args+=(--pack "$A2APARKBENCH_PACK")
        fi
        node "$GITHUB_ACTION_PATH/bin/mutant-web.mjs" "${args[@]}"
